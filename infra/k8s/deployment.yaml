apiVersion: v1
kind: Namespace
metadata:
  name: supply-planner-system
---
apiVersion: v1
kind: Secret
metadata:
  name: supply-planner-llm-secrets
  namespace: supply-planner-system
type: Opaque
stringData:
  gemini_api_key: "REPLACE_IN_SECRET_MANAGER"
  openai_api_key: "REPLACE_IN_SECRET_MANAGER"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: supply-planner-sqlite-pvc
  namespace: supply-planner-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supply-planner-agent
  namespace: supply-planner-system
  labels:
    app: supply-planner-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supply-planner-agent
  template:
    metadata:
      labels:
        app: supply-planner-agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: supply-planner-agent
          image: ghcr.io/enterprise/supply-planner-agent:2.0.0
          ports:
            - containerPort: 8010
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: SQLITE_DB_PATH
              value: "/app/data/supply_planner_memory.db"
            - name: GEMINI_API_KEY_FILE
              value: "/run/secrets/gemini_api_key"
            - name: OPENAI_API_KEY_FILE
              value: "/run/secrets/openai_api_key"
            - name: OTEL_SERVICE_NAME
              value: "supply-planner-multi-agent"
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data
            - name: llm-secrets
              mountPath: /run/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8010
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: supply-planner-sqlite-pvc
        - name: llm-secrets
          secret:
            secretName: supply-planner-llm-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: supply-planner-service
  namespace: supply-planner-system
spec:
  selector:
    app: supply-planner-agent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8010
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: supply-planner-hpa
  namespace: supply-planner-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: supply-planner-agent
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
